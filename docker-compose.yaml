# docker-compose.yml
#
# `docker compose up -d --build` runs just the app, using the database in
# DATABASE_URL (.env) — normally Supabase's Session-pooler URL.
#
# For a self-contained setup with its own Postgres instead, set
#   DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
# in .env and start with:  docker compose --profile local-db up -d --build
services:
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    # Bound to loopback only so `npm run dev` on the host can reach it at
    # localhost:5432 — still unreachable from the network/internet. The `app`
    # container talks to it over the internal Docker network as `db:5432`.
    # Never change this to a bare "5432:5432" on a public-facing VPS.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
        required: false # only present with --profile local-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — set it in .env (your Supabase Session-pooler URL)}
      SCRAPE_DO_API_KEY: ${SCRAPE_DO_API_KEY:?SCRAPE_DO_API_KEY is required — set it in .env}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}

volumes:
  pgdata:
